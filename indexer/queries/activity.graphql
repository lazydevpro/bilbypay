# Queries the BilbyPay server runs against the indexer's GraphQL endpoint (Hasura, served by
# "envio dev" on http://localhost:8080/v1/graphql or by Envio Cloud).
# src/client.ts sends exactly these documents (test/client.test.ts keeps the two in sync).
#
# Notes
# - Rows are per chain: always filter on chainId (143 mainnet, 10143 testnet).
# - Addresses are lowercase ids. BigInt fields arrive as strings.
# - Keyset pagination on (blockNumber, logIndex): start with beforeBlock = 2147483647.

query ActivityFeed($chainId: Int!, $account: String!, $limit: Int!, $beforeBlock: Int!, $beforeLog: Int!) {
  ActivityItem(
    where: {
      chainId: { _eq: $chainId }
      account_id: { _eq: $account }
      _or: [
        { blockNumber: { _lt: $beforeBlock } }
        { blockNumber: { _eq: $beforeBlock }, logIndex: { _lt: $beforeLog } }
      ]
    }
    order_by: [{ blockNumber: desc }, { logIndex: desc }]
    limit: $limit
  ) {
    id
    kind
    status
    amount
    counterparty
    counterpartyAccount_id
    counterpartyPhoneKey
    deposit_id
    giftId
    expiresAt
    createdAt
    updatedAt
    blockNumber
    logIndex
    txHash
  }
}

query AccountSummary($chainId: Int!, $account: String!) {
  Account(where: { chainId: { _eq: $chainId }, id: { _eq: $account } }) {
    id
    phoneKey
    isBound
    boundAt
    reboundAt
    ausdIn
    ausdOut
    ausdNetFlow
    sentCount
    sentVolume
    receivedCount
    receivedVolume
    giftsSentCount
    giftsReceivedCount
    pendingOutgoing
    autoSaveEnabled
    autoSaveThreshold
    firstSeenAt
    lastActiveAt
  }
  BurrowPosition(where: { chainId: { _eq: $chainId }, id: { _eq: $account } }) {
    shares
    depositedAssets
    withdrawnAssets
    netDeposited
    sweepCount
    sweptAssets
    addCount
    breakCount
  }
  GlobalStats(where: { chainId: { _eq: $chainId } }) {
    sharePriceWad
  }
}

query RecentContacts($chainId: Int!, $account: String!, $limit: Int!) {
  ContactEdge(
    where: { chainId: { _eq: $chainId }, from_id: { _eq: $account } }
    order_by: [{ lastAt: desc }]
    limit: $limit
  ) {
    to_id
    count
    volume
    lastAt
  }
}

query PhoneStatus($chainId: Int!, $phoneKey: String!) {
  Phone(where: { chainId: { _eq: $chainId }, id: { _eq: $phoneKey } }) {
    id
    account_id
    boundAt
    rebindCount
    lastReboundAt
    revision
    phoneEpoch
    validUntil
    revoked
    pendingAccount
    pendingExecutableAt
    pendingExpiresAt
    pendingRevision
    lastUpdatedBlock
    lastUpdatedLog
  }
}

# Optional discovery/history feed. Check the deployment address and reconcile against finalized
# RPC state before persisting an authoritative binding. A cursor alone does not survive reorgs.
query DirectoryChanges($chainId: Int!, $afterBlock: Int!, $afterLog: Int!, $toBlock: Int!, $limit: Int!) {
  DirectoryChange(
    where: {
      chainId: { _eq: $chainId }
      blockNumber: { _lte: $toBlock }
      _or: [
        { blockNumber: { _gt: $afterBlock } }
        { blockNumber: { _eq: $afterBlock }, logIndex: { _gt: $afterLog } }
      ]
    }
    order_by: [{ blockNumber: asc }, { logIndex: asc }]
    limit: $limit
  ) {
    id
    phone_id
    action
    account
    proposedAccount
    revision
    phoneEpoch
    validUntil
    revoked
    executableAt
    expiresAt
    timestamp
    blockNumber
    logIndex
    txHash
    directoryAddress
  }
}

query ProtocolStats($chainId: Int!, $days: Int!) {
  GlobalStats(where: { chainId: { _eq: $chainId } }) {
    accounts
    boundPhones
    rebinds
    paymentsCount
    paymentsVolume
    directTransferCount
    directTransferVolume
    externalInVolume
    externalOutVolume
    escrowDepositCount
    escrowDepositVolume
    escrowPendingCount
    escrowPendingValue
    escrowClaimCount
    escrowRefundCount
    escrowCancelCount
    claimRate
    giftCount
    giftVolume
    avgTimeToClaim
    medianTimeToClaim
    p90TimeToClaim
    timeToClaimHistogram
    burrowAccounts
    burrowShares
    burrowNetDeposited
    burrowTvlEstimate
    autoSaveEnabledCount
    sharePriceWad
    updatedAt
  }
  DailyStats(where: { chainId: { _eq: $chainId } }, order_by: [{ day: desc }], limit: $days) {
    date
    activeAccounts
    newAccounts
    paymentsCount
    paymentsVolume
    escrowDepositCount
    escrowClaimCount
    giftVolume
    timeToClaimSum
    timeToClaimCount
    burrowInVolume
    burrowOutVolume
  }
  _meta {
    chainId
    isReady
  }
}
